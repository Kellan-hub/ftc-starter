import java.text.SimpleDateFormat

/**
 * The Robot Controller app itself.
 *
 * This module holds the stock FIRST/Qualcomm app scaffolding and produces the
 * APK that gets installed on the Control Hub. Your code lives in :TeamCode,
 * which this module pulls in below.
 */

apply plugin: 'com.android.application'

android {
    compileSdk 35
    namespace 'com.qualcomm.ftcrobotcontroller'

    signingConfigs {
        release {
            def apkStoreFile = System.getenv("APK_SIGNING_STORE_FILE")
            if (apkStoreFile != null) {
                keyAlias System.getenv("APK_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("APK_SIGNING_KEY_PASSWORD")
                storeFile file(System.getenv("APK_SIGNING_STORE_FILE"))
                storePassword System.getenv("APK_SIGNING_STORE_PASSWORD")
            } else {
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile rootProject.file('libs/ftc.debug.keystore')
                storePassword 'android'
            }
        }
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile rootProject.file('libs/ftc.debug.keystore')
            storePassword 'android'
        }
    }

    defaultConfig {
        signingConfig signingConfigs.debug
        applicationId 'com.qualcomm.ftcrobotcontroller'
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 61
        versionName "11.1"
        buildConfigField "String", "APP_BUILD_TIME", '"' + (new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ", Locale.ROOT).format(new Date())) + '"'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            ndk { abiFilters "arm64-v8a" }
        }
        debug {
            debuggable true
            jniDebuggable true
            ndk { abiFilters "arm64-v8a" }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    packagingOptions {
        pickFirst '**/*.so'
        jniLibs.useLegacyPackaging true
    }

    ndkVersion '21.3.6528147'
}

dependencies {
    implementation project(':TeamCode')
}

apply from: '../build.dependencies.gradle'
