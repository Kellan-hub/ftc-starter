/**
 * Your team's code.
 *
 * This is a library module: it is compiled into the Robot Controller APK built
 * by :FtcRobotController. Write your OpModes in
 * src/main/java/org/firstinspires/ftc/teamcode/ — the SDK finds them by their
 * @TeleOp / @Autonomous annotations, no registration needed.
 */

apply plugin: 'com.android.library'

android {
    compileSdk 35
    namespace 'org.firstinspires.ftc.teamcode'

    defaultConfig {
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

apply from: '../build.dependencies.gradle'
